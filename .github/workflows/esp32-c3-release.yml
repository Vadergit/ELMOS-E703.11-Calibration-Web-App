name: Compile and publish universal DIY bridges
on:
  pull_request:
    paths:
      - "firmware/esp32c3_supermini/**"
      - "firmware/pro_micro/**"
      - "firmware/libraries/**"
      - ".github/workflows/esp32-c3-release.yml"
  push:
    branches: [main]
    paths:
      - "firmware/esp32c3_supermini/**"
      - "firmware/pro_micro/**"
      - "firmware/libraries/**"
      - ".github/workflows/esp32-c3-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 and SparkFun AVR board cores
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install arduino:avr@1.8.6
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/sparkfun/Arduino_Boards/main/IDE_Board_Manager/package_sparkfun_index.json
          arduino-cli core install SparkFun:avr --additional-urls https://raw.githubusercontent.com/sparkfun/Arduino_Boards/main/IDE_Board_Manager/package_sparkfun_index.json
      - name: Test I2C address discovery and bridge guards
        run: node --test tests/i2c-address-range.test.cjs tests/universal-bridge.test.cjs
      - name: Compile ESP32-C3 SuperMini CDC firmware
        run: |
          set -euo pipefail
          mkdir -p build/esp
          arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc --libraries firmware/libraries --output-dir build/esp firmware/esp32c3_supermini
      - name: Compile Pro Micro firmware for 5 V / 16 MHz
        run: |
          set -euo pipefail
          mkdir -p build/pro-16
          arduino-cli compile --fqbn SparkFun:avr:promicro:cpu=16MHzatmega32U4 --libraries firmware/libraries --build-property compiler.cpp.extra_flags=-std=gnu++17 --output-dir build/pro-16 firmware/pro_micro
      - name: Compile Pro Micro firmware for 3.3 V / 8 MHz
        run: |
          set -euo pipefail
          mkdir -p build/pro-8
          arduino-cli compile --fqbn SparkFun:avr:promicro:cpu=8MHzatmega32U4 --libraries firmware/libraries --build-property compiler.cpp.extra_flags=-std=gnu++17 --output-dir build/pro-8 firmware/pro_micro
      - name: Publish verified built binaries on main only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          esp="firmware/releases/esp32-c3/v0.16"
          pro="firmware/releases/pro-micro/v0.29"
          mkdir -p "$esp" "$pro"
          app=$(find build/esp -maxdepth 1 -name '*.ino.bin' -print -quit)
          boot=$(find build/esp -maxdepth 1 -name '*.bootloader.bin' -print -quit)
          part=$(find build/esp -maxdepth 1 -name '*.partitions.bin' -print -quit)
          pro16=$(find build/pro-16 -maxdepth 1 -name '*.ino.hex' -print -quit)
          pro8=$(find build/pro-8 -maxdepth 1 -name '*.ino.hex' -print -quit)
          for name in "$app" "$boot" "$part" "$pro16" "$pro8"; do test -n "$name" && test -s "$name"; done
          cp "$app" "$esp/application.bin"
          cp "$boot" "$esp/bootloader.bin"
          cp "$part" "$esp/partitions.bin"
          cp firmware/releases/esp32-c3/v0.10/boot_app0.bin "$esp/boot_app0.bin"
          cp "$pro16" "$pro/pro-micro-16mhz.hex"
          cp "$pro8" "$pro/pro-micro-8mhz.hex"
          cat > "$esp/manifest.json" <<'MANIFEST'
          {
            "name": "ELMOS E703.11 Universal DIY Bridge (Laborversion)",
            "version": "0.16",
            "new_install_prompt_erase": false,
            "builds": [{
              "chipFamily": "ESP32-C3",
              "parts": [
                {"path":"bootloader.bin","offset":0},
                {"path":"partitions.bin","offset":32768},
                {"path":"boot_app0.bin","offset":57344},
                {"path":"application.bin","offset":65536}
              ]
            }]
          }
          MANIFEST
          python3 - <<'PY'
          from pathlib import Path
          p = Path("firmware-update.html")
          s = p.read_text()
          if 'manifest="firmware/releases/esp32-c3/v0.16/manifest.json"' not in s:
              anchor = '<div class="actions">\n    <esp-web-install-button manifest="firmware/releases/esp32-c3/v0.14/manifest.json">'
              replacement = """<div class="actions">
              <p class="note"><strong>v0.16 (One-Wire-Testfirmware):</strong> Zusätzliche Startversuche für bereits analog abgeglichene Sensoren mit 4-ms-Startfenster. Timing-Diagnose, keine Änderung der NVM-Schreiblogik. Hardwareprüfung ausstehend. Vor dem Flashen Original-NVM und ungesicherte Abgleichdaten sichern.</p>
              <esp-web-install-button manifest="firmware/releases/esp32-c3/v0.16/manifest.json">
                <button type="button" slot="activate" disabled>ESP32 v0.16 installieren (Test)</button>
                <span slot="unsupported">Chrome oder Edge auf dem Computer verwenden.</span>
                <span slot="not-allowed">HTTPS oder localhost erforderlich.</span>
              </esp-web-install-button>
              <p>Vorherige Version als Rückfallmöglichkeit:</p>
              <esp-web-install-button manifest="firmware/releases/esp32-c3/v0.14/manifest.json">"""
              assert anchor in s, "Installer anchor missing"
              s = s.replace(anchor, replacement, 1).replace('>ESP32 installieren</button>', '>ESP32 v0.14 installieren</button>', 1).replace('v0.14 (Labor)</span></h2>', 'v0.16 (Test) / v0.14</span></h2>', 1)
              p.write_text(s)
          PY
          grep -q 'manifest="firmware/releases/esp32-c3/v0.16/manifest.json"' firmware-update.html
          grep -q 'firmware/releases/pro-micro/v0.29/pro-micro-8mhz.hex' firmware-update.html
          grep -q 'BRIDGE_USER_NVM_V1' firmware/esp32c3_supermini/esp32c3_supermini.ino
          grep -q 'BRIDGE_USER_NVM_V1' firmware/pro_micro/pro_micro.ino
          test -s "$esp/application.bin"
          test -s "$pro/pro-micro-16mhz.hex"
          test -s "$pro/pro-micro-8mhz.hex"
      - name: Commit compiled firmware and installer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/releases/esp32-c3/v0.16 firmware/releases/pro-micro/v0.29 firmware-update.html pro-micro-installer.js
          if ! git diff --cached --quiet; then
            git commit -m "release: ESP32-C3 v0.16 and Pro Micro v0.29 universal bridges"
            git push
          fi
