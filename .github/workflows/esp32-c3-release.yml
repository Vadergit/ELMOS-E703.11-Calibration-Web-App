name: Build ESP32-C3 v0.11 test firmware
on:
  push:
    paths:
      - "firmware/esp32c3_supermini/**"
      - ".github/workflows/esp32-c3-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile USB CDC ESP32-C3 SuperMini
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc --libraries firmware/libraries --output-dir build firmware/esp32c3_supermini
      - name: Package new release
        run: |
          set -euo pipefail
          dest="firmware/releases/esp32-c3/v0.11"
          mkdir -p "$dest"
          ls -lah build
          app=$(find build -maxdepth 1 -name '*.ino.bin' -print -quit)
          boot=$(find build -maxdepth 1 -name '*.bootloader.bin' -print -quit)
          part=$(find build -maxdepth 1 -name '*.partitions.bin' -print -quit)
          test -n "$app" && test -s "$app"
          test -n "$boot" && test -s "$boot"
          test -n "$part" && test -s "$part"
          cp "$app" "$dest/application.bin"
          cp "$boot" "$dest/bootloader.bin"
          cp "$part" "$dest/partitions.bin"
          cp firmware/releases/esp32-c3/v0.10/boot_app0.bin "$dest/boot_app0.bin"
          cat > "$dest/manifest.json" <<'MANIFEST'
          {
            "name": "Elmos E703.11 USB-Bridge (Ausgangs-NVM Testversion)",
            "version": "0.11",
            "new_install_prompt_erase": false,
            "builds": [{
              "chipFamily": "ESP32-C3",
              "parts": [
                {"path":"bootloader.bin","offset":0},
                {"path":"partitions.bin","offset":32768},
                {"path":"boot_app0.bin","offset":57344},
                {"path":"application.bin","offset":65536}
              ]
            }]
          }
          MANIFEST
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('firmware-update.html')
          x=p.read_text()
          x=x.replace('ESP32-C3 SuperMini <span class="version">v0.10</span>', 'ESP32-C3 SuperMini <span class="version">v0.11 (Test)</span>')
          x=x.replace('manifest="firmware/releases/esp32-c3/v0.10/manifest.json"','manifest="firmware/releases/esp32-c3/v0.11/manifest.json"')
          x=x.replace('Der Installer installiert weiterhin die bisherige v0.10 ohne diese Funktion. Ein neuer, noch nicht hardwarevalidierter', 'Der Installer installiert die neue v0.11-Testfirmware. Ihr NVM-Schreibpfad ist noch nicht an echter Hardware validiert. Ein neuer')
          p.write_text(x)
          PYTHON
          test -s "$dest/application.bin"
          grep -q 'manifest="firmware/releases/esp32-c3/v0.11/manifest.json"' firmware-update.html
      - name: Commit compiled release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/releases/esp32-c3/v0.11 firmware-update.html
          git commit -m "release: compiled ESP32-C3 v0.11 test firmware and installer" || exit 0
          git push
