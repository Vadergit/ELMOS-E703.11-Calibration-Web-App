name: E703.11 offline calibration regression
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  calibration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check calculator and navigation scripts
        run: |
          node --check nvm-reconstruction.js
          node --check nvm-reconstruction-trace.js
          node --check app.js
          node --check guided.js
      - name: Run calibration, NVM reconstruction and offline UI tests
        run: node --test tests/elmos-calibration.test.cjs tests/nvm-reconstruction.test.cjs tests/nvm-rechner-offline.test.cjs tests/nvm-formula-trace.test.cjs
