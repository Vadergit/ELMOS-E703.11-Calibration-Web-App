name: E703.11 offline calibration regression
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  calibration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original-documentation and AODO NVM safety tests
        run: node --test tests/elmos-calibration.test.cjs
