name: E703.11 offline calibration regression
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  calibration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check calculator and navigation scripts
        run: |
          node --check nvm-reference-profile.js
          node --check nvm-reconstruction.js
          node --check nvm-reconstruction-trace.js
          node --check archive-core.js
          node --check archive.js
          node --check eeprom-config-overview.js
          node --check calibration-complete.js
          node --check archive-analysis.js
          node --check test-logger.js
          node --check expert.js
          node --check verification-report.js
          node --check calibration-report.js
          node --check logging-report.js
          node --check app.js
          node --check guided.js
          node --check home-navigation.js
      - name: Run calibration, NVM reconstruction and offline UI tests
        run: node --test tests/elmos-calibration.test.cjs tests/nvm-reconstruction.test.cjs tests/nvm-rechner-offline.test.cjs tests/nvm-formula-trace.test.cjs tests/nvm-reference-profile.test.cjs tests/calibration-complete.test.cjs tests/archive-descriptive-filenames.test.cjs tests/verification-reference.test.cjs tests/logging-report.test.cjs tests/archive-photos.test.cjs tests/archive.test.cjs tests/test-logger.test.cjs tests/eeprom-config-overview.test.cjs tests/elmos-settings.test.cjs tests/guided-connection.test.cjs tests/home-navigation.test.cjs tests/view-persistence.test.cjs
