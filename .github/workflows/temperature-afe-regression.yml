name: E703.11 temperature AFE planner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check temperature-afe.js
      - run: node --test tests/temperature-afe.test.cjs
