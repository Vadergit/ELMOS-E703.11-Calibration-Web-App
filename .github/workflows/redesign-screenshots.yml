name: Guided UI layout checks and optional gallery
on:
  push:
    branches: [ui-ux-redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_gallery:
        description: 'Save a complete visual gallery (all checks always run)'
        type: boolean
        default: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check rendered layout and buttons
        env:
          UI_FULL_GALLERY: ${{ github.event_name == 'workflow_dispatch' && inputs.full_gallery }}
        run: |
          node --check tests/redesign-screenshots.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/elmos-http.log 2>&1 &
          node tests/redesign-screenshots.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-layout-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: error
