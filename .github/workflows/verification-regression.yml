name: Verification regression
on:
  pull_request:
    branches: [main]
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check calibration-report.js
          node --check calibration-graph.js
          node --check guided.js
          node --check archive.js
          node --check app.js
          node --check calibration.js
          node --check verification-report.js
          node --check verification-graph.js
          node --check archive-readable-csv.js
      - name: Unit and regression tests
        run: node --test tests/verification-reference.test.cjs tests/view-persistence.test.cjs tests/pressure-preset.test.cjs tests/calibration-graph.test.cjs tests/calibration-report.test.cjs tests/archive-folder-settings.test.cjs tests/tk0-tke.test.cjs
